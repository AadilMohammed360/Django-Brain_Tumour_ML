{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Landing Page</title>
    
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <style>
            a{
                text-decoration: none;
            }
        </style>
    </head>
<body>

          <!-- Navbar Start -->
          <nav class="navbar navbar-expand-lg bg-white navbar-light shadow sticky-top p-0">
            <a href="index.html" class="navbar-brand d-flex align-items-center text-center py-0 px-4 px-lg-5">
                <h1 class="m-0 text-primary">Schizophrenia Detection</h1>
            </a>
            <button type="button" class="navbar-toggler me-4" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav ms-auto p-4 p-lg-0 me-5">
                    <a href={% url "index" %} class="nav-item nav-link active">Home</a>
                    <a href={% url "login" %} class="nav-item nav-link active">Login</a>
                </div>
                <a href={% url "index" %} class="btn btn-primary rounded-0 py-4 px-lg-5 d-none d-lg-block">Disease<i class="fa fa-arrow-right ms-3"></i></a>
            </div>
        </nav>
        <!-- Navbar End -->
        
        
        <!-- Header End -->
        <div class="container-xxl py-3 bg-dark page-header mb-5">
            <div class="container">
                <h1 class="display-5 text-white mb-3 animated slideInDown">Login</h1>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb text-uppercase">
                        <li class="breadcrumb-item"><a href="#">Home</a></li>
                        <li class="breadcrumb-item text-white active" aria-current="page">Login</li>
                    </ol>
                </nav>
            </div>
        </div>
        <!-- Header End -->
        <!-- Contact Start -->
        <div class="container-xxl py-5">
            <div class="container y_padding_custom">
                <h1 class="text-center mb-5 wow fadeInUp" data-wow-delay="0.1s">Login Here</h1>
                <div class="row justify-content-center g-4" style="height: 50vh;">
                    {% comment %} <div class="col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                        <img  alt="" style="height: 75%;" src={% static "img/login.gif" %}>
                    </div> {% endcomment %}
                    <div class="col-md-6 my-auto">
                        <div class="wow fadeInUp" data-wow-delay="0.5s">
                            
                            <form method='post' action='{% url "accountlogin" %}' id="loginform">
                                {% csrf_token %}
                                <div class="row g-3">
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" aria-describedby="username-error" id="subject" name="username" placeholder="Username">
                                            <label for="username">Username</label>
                                            <div id="username-error"></div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <div class="form-floating">
                                            <input type="text" class="form-control" aria-describedby="password-error" id="subjct" name="password" placeholder="Password">
                                            <label for="password">Password</label>
                                            <div id="password-error"></div>
                                        </div>
                                    </div>
                                    <div class="col-12">
                                        <button class="btn btn-primary w-100 py-3" type="submit">Login</button>
                                    </div>
                                </div>
                            </form>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Contact End -->        

        <!-- Footer Start -->
        <div class="container-fluid bg-dark text-white-50 footer wow fadeIn" data-wow-delay="0.1s">

            <div class="container py-4">
                <div class="copyright">
                    <div class="row">
                        <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                            &copy; <a class="border-bottom" href="#">Disease Detection </a>, All Right Reserved. 
                        </div>
                        <div class="col-md-6 text-center text-md-end">
                            <div class="footer-menu">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer End -->
</body>
</html>
