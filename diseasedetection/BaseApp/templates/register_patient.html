{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Scan</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- Bootstrap Icons CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Animate CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css">

    <!-- Bootstrap Datepicker CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/css/bootstrap-datepicker.min.css">
    <style>
        a{
            text-decoration: none;
        }
    </style>
</head>
<body>
<!-- Your content for the staff's welcome page here -->
         <!-- Navbar Start -->
         <nav class="navbar navbar-expand-lg justify-content-between bg-white navbar-light shadow sticky-top p-0 m-0">
            <a href={% url "staff_welcome" %} ><i class="bi bi-power fs-3" style="margin-left: 30px;"></i></a>
            <span class="navbar-brand d-flex align-items-center text-center py-0 px-4 px-lg-5" style="margin-left: 14rem;">
                <h1 class="text-primary" style="margin-left: 180px; margin-right: 130px;">Schizophrenia Detection</h1>
            </span>
            <a href={% url "staff_welcome" %} class="btn btn-primary rounded-0 py-4 px-lg-5 d-none d-lg-block text-white" >Staff Panel</a>
        </nav>
        <!-- Navbar End -->


<!-- Header End -->
<div class="container-xxl py-1 bg-dark page-header mb-5">
    <div class="container my-5">
        <h1 class="display-5 text-white mb-3 animated slideInDown" id="headertext">Add Diagnosis</h1>
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb text-uppercase">
                <li class="breadcrumb-item"><a href="#">Home</a></li>
                <li class="breadcrumb-item"><a href="#">Staff</a></li>
                <li class="breadcrumb-item text-white active" aria-current="page" id="crumbtext">Add Diagnosis</li>
            </ol>
        </nav>
    </div>
</div>
<!-- Header End -->


<!-- Contact Start -->
<div class="container-xxl">
    <div class="container">
        <h1 class="text-center mb-5 wow fadeInUp" data-wow-delay="0.1s" id="contacttext">Add Diagnosis</h1>
        <div class="row g-4 justify-content-center " style="height: 70vh;">
            {% comment %} <div class="col-md-6 wow fadeInUp" data-wow-delay="0.1s">
                <img src="{% static 'img/register.gif' %}" alt="" style="height: 75%;">
            </div> {% endcomment %}
            <div class="col-md-6">
                <div class="wow fadeInUp" data-wow-delay="0.5s">
                    <form method='post' action='{% url "add_patient_data" %}' enctype="multipart/form-data" id="patientform">
                        {% csrf_token %}
                        <div class="row g-3">
                            <input type="text" value="{{report}}" id="reporttype" hidden>
                            <div class="col-12" id="reportidfield">
                                <div class="form-floating">
                                    <input type="text" class="form-control" aria-describedby="id-error" id="id" name="id" placeholder="Patient id">
                                    <label for="id">Patient Id (Existing)</label>
                                    <div id="id-error"></div>
                                </div>
                            </div>
                            <div class="col-12" id="namecol">
                                <div class="form-floating">
                                    <input type="text" class="form-control" aria-describedby="name-error" id="name" name="name" placeholder="Patient Name">
                                    <label for="name">Patient Name</label>
                                    <div id="name-error"></div>
                                </div>
                            </div>
                            <div class="col-12" id="agecol">
                                <div class="form-floating">
                                    <!-- Add the 'datepicker' class to enable Bootstrap Datepicker -->
                                    <input type="date" class="form-control datepicker" aria-describedby="age-error" id="age" name="age" placeholder="Patient Age">
                                    <label for="age">Patient Dob</label>
                                    <div id="age-error"></div>
                                </div>
                            </div>
                            <div class="col-12">
                                <div class="form-floating">
                                    <input type="file" class="form-control" aria-describedby="fmri_photo-error" id="fmri_photo" name="fmri_photo">
                                    <label for="fmri_photo">FMRI Scan Photo</label>
                                    <div id="fmri_photo-error"></div>
                                </div>
                            </div>
                            <div class="col-12">
                                <button type="submit" id="addbtn" class="btn btn-primary w-100 py-3">Register Patient</button>
                            </div>
                            <div class="col-12">
                                <button type="submit" id="upbtn" class="btn btn-primary w-100 py-3">Update Patient</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- Contact End -->
        <!-- Footer Start -->
        <div class="container-fluid bg-dark text-white-50 footer wow fadeIn" data-wow-delay="0.1s">

            <div class="container py-4">
                <div class="copyright">
                    <div class="row">
                        <div class="col-md-6 text-center text-md-start mb-3 mb-md-0">
                            &copy; <a class="border-bottom" href="#">Disease Detection </a>, All Right Reserved. 														
                        </div>
                        <div class="col-md-6 text-center text-md-end">
                            <div class="footer-menu">

                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <!-- Footer End -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Bootstrap Datepicker JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap-datepicker@1.9.0/dist/js/bootstrap-datepicker.min.js"></script>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        // Initialize Bootstrap Datepicker
        $('.datepicker').datepicker({
            format: 'yyyy-mm-dd',  // Set the desired date format
            autoclose: true,  // Close the datepicker when a date is selected
            todayHighlight: true  // Highlight today's date
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', ()=>{
        let reporttype = document.getElementById('reporttype');
        console.log(""+reporttype.value);
        if(reporttype.value == "add"){
            reportidfield = document.getElementById('reportidfield');
            reportidfield.style.display="none";
            updatebtn = document.getElementById('upbtn');
            updatebtn.style.display="none"
        }
        else {
            addbtn = document.getElementById('addbtn');
            addbtn.style.display="none"
            contacttext = document.getElementById('contacttext');
            contacttext.innerText = "Update Diagnosis";
            crumbtext = document.getElementById('crumbtext');
            crumbtext.innerText = "Update Diagnosis";
            headertext = document.getElementById('headertext');
            headertext.innerText = "Update Diagnosis";
            
            var form = document.getElementById('patientform');
            pname = document.getElementById('namecol');
            pname.style.display = "none";
            dob = document.getElementById('agecol');
            dob.style.display = "none";

            // Change the action attribute value
            form.setAttribute('action', '{% url "up_patient_data" %}');
        }
    });
</script>


<script src="assets/js/bs-init.js"></script>
<script src="assets/js/jquery.min.js"></script>
</body>
</html>
