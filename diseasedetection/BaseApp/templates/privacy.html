            a{
                text-decoration: none;

            input {
              width: 500px;
              height: 35px;
            }
        </style>

<body>
    <!-- Your content for the staff's welcome page here -->
         <!-- Navbar Start -->
         <nav class="navbar navbar-expand-lg justify-content-between bg-white navbar-light shadow sticky-top p-0 m-0">
            <a href={% url "privacy" %} ><i class="bi bi-power fs-3" style="margin-left: 30px;"></i></a>
            <span href="#"class="navbar-brand d-flex align-items-center text-center py-0 px-4 px-lg-5" style="margin-left: 5rem;">
                <h1 class="text-primary" style="margin-left: 180px; margin-right: 130px;">Schizophrenia Detection</h1>
            </span>

        </nav>
        <!-- Navbar End -->
        
        
                <!-- Header End -->
                <div class="container-xxl py-1 bg-dark page-header mb-3">
                    <div class="container my-5">
                        <h1 class="display-5 text-white mb-3 animated slideInDown">Privacy</h1>
                        <nav aria-label="breadcrumb">
                            <ol class="breadcrumb text-uppercase">
                                <li class="breadcrumb-item"><a href="#">Accounts</a></li>
                                <li class="breadcrumb-item text-white active" aria-current="page">Privacy</li>
                            </ol>
                        </nav>
                    </div>
                </div>
                <!-- Header End -->
        
        
 <!-- contact section -->
 <section class="contact_section layout_padding">
  <div class="container">
    <div class="heading_container text-center mt-5 pt-3">
      <h2 class="mt-5 mb-4 display-6" style="font-weight: 350;">
        <strong>Update Privacy Here</strong>
      </div>
    <div class="">
      <div class="row justify-content-center ">
        <div class="col-8 mx-auto text-center">
          <form action="manageprivacy" method="post" onsubmit="return validatePassword(this)">
            {% csrf_token %}
            <div class="contact_form-container">
              <div>
                <div class="form-control border border-0 shadow-none mb-3 rounded-5">
                  <input type="text" placeholder="username" name="username">
                </div>
                <div class="form-control border border-0 shadow-none mb-3 rounded-5">
                  <input type="password" placeholder="New password" name="password" id="password">
                </div>
                <div class="form-control border border-0 shadow-none mb-3 rounded-5">
                  <input type="password" placeholder="Confirm password" name="confirm_password" id="confirm_password">
                </div>
                <div class="d-flex justify-content-center mt-4">
                  <input class="btn btn-primary" type="submit" value="Update" id="button">
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
  function validatePassword(form) {
    var userName = form.username.value;
    var newPassword = form.password.value;
    var confirmPassword = form.confirm_password.value;

    if (userName === "") {
      alert('Enter username');
      return false;
    }
    if (newPassword === "") {
      alert('Enter password');
      return false;
    }
    if (confirmPassword === "") {
      alert('Enter again to confirm');
      return false;
    }
    if (confirmPassword !== newPassword) {
      alert('Password Mismatch');
      form.confirm_password.focus();
      form.password.value = "";
      form.confirm_password.value = "";
      return false;
    }

    // Add the alert for successful update
    alert('Successfully updated');
    return true;
  }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- end contact section -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>



</body>
</html>
