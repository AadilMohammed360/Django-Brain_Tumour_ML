{% load static %}
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Detect Disease</title>
    
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css">

    </head>
<body>
    <!-- Your content for the staff's welcome page here -->
         <!-- Navbar Start -->
         <nav class="navbar navbar-expand-lg justify-content-between bg-white navbar-light shadow sticky-top p-0 m-0">
            <a href='{% url "index" %}' ><i class="bi bi-power fs-3" style="margin-left: 30px;"></i></a>
            <a href="index.html" class="navbar-brand d-flex align-items-center text-center py-0 px-4 px-lg-5" style="margin-left: 9rem;">
                <h1 class="m-0 text-primary">Schizophrenia Detection</h1>
            </a>
                <a href='{% url "doctor_welcome" %}' class="btn btn-primary rounded-0 py-4 px-lg-5 d-none d-lg-block text-white">Disease</a>
            </div>
        </nav>
        <!-- Navbar End -->
        
        
<!-- Contact Start -->
<div class="container-xxl py-5" style="min-height:100vh">
    <div class="container">
        <h1 class="text-center mb-4 wow fadeInUp" data-wow-delay="0.1s">Summary</h1>
        <div>
            <center>
    
                <img src="{{photo_media_path}}" alt="" width="360px">
            </center>
        </div>
        <div class="text-center mt-4">
            <h3 class="fs-4">The patient is shizophrenia <span id="result_badge">{{result}}</span></h3>
        </div>

        <center>

            <a href='{% url "view_patient_data" %}' class=" btn btn-primary mt-5">Go Back</a>
        </center>

    </div>
</div>
<!-- Contact End -->
<script>
result_badge = document.getElementById('result_badge');
pred_result = '{{result}}';
if(pred_result == "Positive"){
    result_badge.style.color = "red";
}
else {
    result_badge.style.color = "green";

}

</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>





    <!-- Bootstrap Bundle JS -->

    <!-- WOW.js Initialization -->
    <script>
        new WOW().init();
    </script>
</body>
</html>
